plugins {
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = '0.2.0'
group = 'com.lazarus.wrecks'
base.archivesName = 'lazaruswrecks'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.10'
    compileOnly files(findProperty('cityworldJar') ?: System.getenv('CITYWORLD_JAR') ?: 'C:/Users/kaikr/curseforge/minecraft/Instances/Project Lazarus - Alpha 1.0.0/mods/cityworld-6.3.0+mc1.20.1.jar')
    compileOnly files(findProperty('mtsJar') ?: System.getenv('MTS_JAR') ?: 'C:/Users/kaikr/curseforge/minecraft/Instances/Project Lazarus - Alpha 1.0.0/mods/Immersive Vehicles-1.20.1-24.0.0.jar')
}

tasks.named('jar', Jar).configure {
    finalizedBy 'reobfJar'
}
